<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Photobook Frame by Storitellah">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141416"/>
      <stop offset="1" stop-color="#232328"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6C27A"/>
      <stop offset="0.55" stop-color="#E9967A"/>
      <stop offset="1" stop-color="#6B4E3D"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BC37A"/>
      <stop offset="1" stop-color="#3F6B3A"/>
    </linearGradient>
    <linearGradient id="crease" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <g stroke="#2C2C33" stroke-width="1">
    <path d="M0 40H1200M0 320H1200"/>
  </g>
  <g fill="#3F3F46" font-family="ui-monospace, Menlo, monospace" font-size="11">
    <text x="640" y="30">0</text><text x="740" y="30">1</text><text x="840" y="30">2</text><text x="940" y="30">3</text><text x="1040" y="30">4</text><text x="1140" y="30">5</text>
  </g>

  <!-- open book spread -->
  <g transform="translate(620 70) rotate(-2)" filter="url(#shadow)">
    <rect width="520" height="220" fill="#FAF8F5"/>
    <rect x="22" y="22" width="216" height="176" fill="url(#sun)"/>
    <path d="M22 160c40-14 70-20 110-12s70 4 106-6v56H22z" fill="#3B3227" opacity="0.85"/>
    <circle cx="170" cy="92" r="20" fill="#FFE2A8" opacity="0.9"/>
    <rect x="292" y="22" width="96" height="120" fill="url(#leaf)"/>
    <rect x="398" y="22" width="100" height="74" fill="#C9A27A"/>
    <rect x="398" y="104" width="100" height="94" fill="#7FA0B8"/>
    <rect x="292" y="152" width="96" height="10" fill="#1C1917" opacity="0.75"/>
    <rect x="292" y="170" width="70" height="6" fill="#78716C" opacity="0.6"/>
    <text x="232" y="190" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#FF8A2B">'26 11 08</text>
    <rect x="246" width="28" height="220" fill="url(#crease)"/>
    <rect x="18" y="18" width="484" height="184" fill="none" stroke="#F59E0B" stroke-opacity="0.45" stroke-dasharray="4 4"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(64 120)">
    <rect width="40" height="40" rx="9" fill="#F59E0B" fill-opacity="0.18" stroke="#F59E0B" stroke-opacity="0.5"/>
    <path d="M9 13c4-2 8-2 11 1v16c-3-3-7-3-11-1zM31 13c-4-2-8-2-11 1v16c3-3 7-3 11-1z" fill="#F59E0B"/>
    <text x="0" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#F4F4F5">Photobook Frame</text>
    <text x="2" y="134" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9A9AA6">by <tspan fill="#F59E0B">Storitellah</tspan> · a photobook layout studio in one HTML file</text>
  </g>
</svg>
